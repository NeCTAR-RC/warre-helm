# Default values for warre.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


conf:
  keystone:
    auth_url:
    username: warre
    project_name: service
    endpoint_id:
    region_name:
    memcached_servers: []
  warre:
    bot_role_id:
    bot_user_id:
  blazar:
    interface: public
  sentry:
    environment: production

vault:
  role: k8s
  settings_secret: 'path/to/secret/in/vault'

api:
  port: 5000
  apache:
    enabled: false
  image:
    repository: registry.rc.nectar.org.au/nectar/warre
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  gateway:
    enabled: false
    annotations: {}
    hostname: chart-example.local
    parentRefs:
      - name: default

worker:
  image:
    repository: registry.rc.nectar.org.au/nectar/warre
  command:
    - warre-worker
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  # Probe the worker's own RPC server via oslo.messaging's built-in
  # ping endpoint (rpc_ping_enabled=true is set in warre.conf). The
  # probe targets the per-host queue warre-worker.<pod hostname>, so
  # it proves this pod's worker is consuming and dispatching messages,
  # catching a cotyledon service manager that is running but spawned
  # no workers. Startup-only on purpose: a liveness probe on the
  # message bus would mass-restart every worker during a RabbitMQ
  # outage that oslo.messaging would ride out by reconnecting;
  # post-start wedges are left to queue/consumer alerting.
  startupProbe:
    exec:
      command:
        - nectar-health-probe
        - "--project"
        - warre
        - rpc-ping
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30

notification:
  name: notification
  image:
    repository: registry.rc.nectar.org.au/nectar/warre
  command:
    - warre-notification
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  # warre-notification runs a notification listener, not an RPC
  # server, so oslo.messaging's RPC ping endpoint is not available.
  # Instead check the pod holds an ESTABLISHED TCP connection to the
  # transport_url port, which catches a cotyledon service manager that
  # is running but spawned no consumer at all. Startup-only on
  # purpose: see worker.startupProbe above.
  startupProbe:
    exec:
      command:
        - nectar-health-probe
        - "--project"
        - warre
        - amqp
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30


job:
  db_sync:
    enabled: true
    command:
      - warre-manage
      - db
      - upgrade

oslo_policy:


image:
  repository: registry.rc.nectar.org.au/nectar/warre
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 42420
  runAsGroup: 42420
  fsGroup: 42420
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  port: 80


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
